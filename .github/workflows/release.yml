# SPDX-License-Identifier: GPL-2.0-only
#
# Publishes an installable release on every merge to main (and on manual dispatch). The
# exporter is an NX Open Python journal — shipped as source and played by NX, so there is
# nothing to compile or code-sign. Alpha builds are marked as prereleases and should be
# validated on a real NX install.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags + releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute version
        id: ver
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Package the UGII_USER_DIR zip (Python journal)
        run: scripts/package_python.sh "${{ steps.ver.outputs.version }}" "Oblikovati.Exporter.NX.Python-${{ steps.ver.outputs.version }}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "Oblikovati.Exporter.NX.Python-${{ steps.ver.outputs.version }}.zip" \
            --title "Oblikovati.Exporter.NX v${{ steps.ver.outputs.version }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "Automated alpha build from ${{ github.sha }}.

          An NX Open **Python journal** — needs no compiled, code-signed plug-in. Install: unzip into a folder and point NX at it via \`UGII_USER_DIR\`, or play \`startup/oblikovati_export.py\` directly (see deploy-python/README.md). The **Export to Oblikovati** item writes native \`.opd\`/\`.oad\` documents.

          Alpha build; validate on your NX version before production use."
