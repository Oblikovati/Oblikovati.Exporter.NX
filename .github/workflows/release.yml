# SPDX-License-Identifier: GPL-2.0-only
#
# Publishes an installable release to GitHub Releases on every merge to main (and on
# manual dispatch). The plugin is compiled against the NXOpen *facade* on a hosted runner
# — the reference-assembly model: the shipped assemblies bind the assembly name "NXOpen",
# which the real NXOpen.dll satisfies at load time inside NX (the facade stub is excluded
# from the zip). This keeps releases automatic without a licensed NX in CI; alpha builds
# are marked as prereleases and should be validated on a real NX install.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags + releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compute version
        id: ver
        run: echo "version=0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Publish the plugin (against the NXOpen facade)
        run: dotnet publish src/Exporter.NX.Entry -c Release -o publish
      - name: Package the UGII_USER_DIR zip
        run: scripts/package.sh publish "${{ steps.ver.outputs.version }}" "Oblikovati.Exporter.NX-${{ steps.ver.outputs.version }}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "Oblikovati.Exporter.NX-${{ steps.ver.outputs.version }}.zip" \
            --title "Oblikovati.Exporter.NX v${{ steps.ver.outputs.version }}" \
            --prerelease \
            --target "${{ github.sha }}" \
            --notes "Automated alpha build from ${{ github.sha }}.

          Install: unzip into a folder and point NX at it via \`UGII_USER_DIR\` (see deploy/README.md). The **Export to Oblikovati** menu item writes native \`.opd\`/\`.oad\` documents.

          Built against the NXOpen facade (hosted CI); validate on your NX version before production use."
